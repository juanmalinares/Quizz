{% extends 'base.html' %}
{% block content %}
  <h2>Upload Textbook</h2>
  <form method="post" enctype="multipart/form-data">
    {{ form.hidden_tag() }}
    <div class="mb-3">{{ form.file.label }} {{ form.file(class='form-control', accept='application/pdf,image/*,.txt') }}</div>
    <div class="mb-3">
      <label>Instructions to AI</label>
      <textarea name="instructions" class="form-control"></textarea>
    </div>
    <div class="mb-3">
      <label>Question count</label>
      <input type="range" name="desired_q" min="10" max="20" value="10" class="form-range"/>
    </div>
    {{ form.submit(class='btn btn-primary') }}
  </form>
{% endblock %}
