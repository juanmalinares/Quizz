{% extends 'base.html' %}
{% block content %}
  <h2>Upload Textbook</h2>
  <form method="post" enctype="multipart/form-data">
    {{ form.hidden_tag() }}
    <div class="mb-3">{{ form.file.label }} {{ form.file(class='form-control') }}</div>
    {{ form.submit(class='btn btn-primary') }}
  </form>
{% endblock %}
